plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	h2Server
}

dependencies {
	h2Server 'com.h2database:h2:2.4.240'
}

// BOM으로 버전 관리
dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.4"
	}
}

// 하위 모듈 공통 설정
subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.4"
		}
	}
}

tasks.register('runH2Server', JavaExec) {
	group = 'application'
	description = 'Runs the shared local H2 TCP/Web server for the project.'

	classpath = configurations.h2Server
	mainClass = 'org.h2.tools.Server'
	args = ['-tcp', '-tcpPort', '8082', '-web', '-webPort', '8083', '-ifNotExists']
}
