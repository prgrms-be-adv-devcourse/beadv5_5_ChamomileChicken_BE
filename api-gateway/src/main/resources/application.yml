server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
          routes:
            - id: file
              uri: ${FILE_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/v1/files/**

            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/api/v1/payments/**

            - id: settlement
              uri: ${SETTLEMENT_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/api/v1/settlements/**

            - id: user
              uri: ${USER_SERVICE_URL:http://localhost:9003}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/email/**, /api/v1/deposits/**, /oauth2/authorization/**, /login/oauth2/code/**

            - id: product
              uri: ${PRODUCT_SERVICE_URL:http://localhost:9004}
              predicates:
                - Path=/api/v1/products/**

            - id: order
              uri: ${ORDER_SERVICE_URL:http://localhost:9005}
              predicates:
                - Path=/api/v1/orders/**

            - id: admin
              uri: ${ADMIN_SERVICE_URL:http://localhost:9007}
              predicates:
                - Path=/api/v1/admins/**

cors:
  allowed-origins:
    - http://localhost:3000

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    jabaclass.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
