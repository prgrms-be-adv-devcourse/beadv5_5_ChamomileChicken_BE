server:
  port: 8080 # Gateway 서비스 포트

spring:
  application:
    name: api-gateway

  # Redis 설정 (Issue #3 블랙리스트 확인용)
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # 서비스 라우팅 설정
      routes:
        # 1. User/Auth 서비스 (로그인, 회원가입 등)
        - id: user-service
          uri: http://localhost:9003
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # 2. Product 서비스
        - id: product-service
          uri: http://localhost:9004
          predicates:
            - Path=/api/v1/products/**

        # 3. Order 서비스
        - id: order-service
          uri: http://localhost:9005
          predicates:
            - Path=/api/v1/orders/**

        # 4. Settlement (정산) 서비스
        - id: settlement-service
          uri: http://localhost:9002
          predicates:
            - Path=/api/v1/settlements/**

        # 5. Payment (결제) 서비스
        - id: payment-service
          uri: http://localhost:9001
          predicates:
            - Path=/api/v1/payments/**

        # 6. File 서비스
        - id: file-service
          uri: http://localhost:9000
          predicates:
            - Path=/api/v1/files/**

app:
  cors:
    allowed-origins:
      - http://localhost:3000