server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

cors:
  allowed-origins:
    - http://localhost:3000

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    jabaclass.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
