server:
  port: 0  # 랜덤 포트 (테스트 충돌 방지)

spring:
  application:
    name: api-gateway

  # Redis (테스트용 더미 설정)
  data:
    redis:
      host: localhost
      port: 6379

  # WebFlux 테스트 시 필요 (선택)
  main:
    allow-bean-definition-overriding: true

cors:
  allowed-origins:
    - http://localhost:3000

jwt:
  # 환경변수 대신 고정값 (CI 깨짐 방지)
  secret: test-secret-test-secret-test-secret

logging:
  level:
    root: WARN