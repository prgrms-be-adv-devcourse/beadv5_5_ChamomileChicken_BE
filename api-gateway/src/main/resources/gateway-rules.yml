gateway:
  whitelist:
    - method: POST
      path: /api/v1/auth/login
    - method: POST
      path: /api/v1/auth/reissue
    - method: GET
      path: /api/v1/auth/report-theft
    - method: POST
      path: /api/v1/users/register
    - method: POST
      path: /api/v1/users/email-check
    - method: POST
      path: /api/v1/email/**
    - method: GET
      path: /api/v1/products
    - method: GET
      path: /api/v1/products/*
    - method: GET
      path: /api/v1/products/*/schedules
    - method: GET
      path: /api/v1/products/*/availability
    - method: GET
      path: /api/v1/products/*/reviewList
    - method: GET
      path: /api/v1/products/*/reviews/*
    - method: GET
      path: /oauth2/authorization/**
    - method: GET
      path: /login/oauth2/code/**

  rbac:
    - method: POST
      path: /api/v1/products
      allowedRoles:
        - SELLER
        - ADMIN
    - method: PUT
      path: /api/v1/products/*
      allowedRoles:
        - SELLER
        - ADMIN
    - method: DELETE
      path: /api/v1/products/*
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/products/my
      allowedRoles:
        - SELLER
    - method: POST
      path: /api/v1/products/*/schedules
      allowedRoles:
        - SELLER
        - ADMIN
    - method: PUT
      path: /api/v1/products/*/schedules/*
      allowedRoles:
        - SELLER
        - ADMIN
    - method: DELETE
      path: /api/v1/products/*/schedules/*
      allowedRoles:
        - SELLER
        - ADMIN
    - method: PUT
      path: /api/v1/users/me/seller-settlement-account
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/settlements
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/settlements/ready
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/settlements/*
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/settlements/me
      allowedRoles:
        - SELLER
        - ADMIN
    - method: GET
      path: /api/v1/settlements/me/*/details
      allowedRoles:
        - SELLER
        - ADMIN
    - method: POST
      path: /api/v1/internal-batch/settlements/calculate
      allowedRoles:
        - ADMIN
    - method: POST
      path: /api/v1/internal-batch/settlements/transfer
      allowedRoles:
        - ADMIN
    - method: GET
      path: /api/v1/admins/**
      allowedRoles:
        - ADMIN
    - method: POST
      path: /api/v1/admins/**
      allowedRoles:
        - ADMIN
    - method: PATCH
      path: /api/v1/admins/**
      allowedRoles:
        - ADMIN
    - method: DELETE
      path: /api/v1/admins/**
      allowedRoles:
        - ADMIN
    - method: GET
      path: /api/v1/auth/internal/**
      allowedRoles: []
