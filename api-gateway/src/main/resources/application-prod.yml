spring:
  config:
    import: "file:/etc/config/gateway-rules.yml"
  data:
    redis:
      host: ${APP_REDIS_HOST:redis}
      port: ${APP_REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    jabaclass.apigateway: INFO
    org.springframework.cloud.gateway: WARN

internal:
  secret: ${USER_INTERNAL_SECRET}
  user-service-url: ${USER_SERVICE_URL}
