spring:
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 1
      min-idle: 2
      max-size: 4
      max-idle-time: 10m
      max-life-time: 30m
      max-acquire-time: 30s


  #  flyway:
  #    enabled: true
  #    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:backend5}
  #    user: ${POSTGRES_USER:postgres}
  #    password: ${POSTGRES_PASSWORD:postgres}

  sql:
    init:
      mode: never
  # 1000ms 500ms
  data:
    redis:
      host: ${APP_REDIS_HOST}
      port: ${APP_REDIS_PORT:6379}
      connect-timeout: 3s
      timeout: 2s

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    jabaclass.apigateway: INFO
    org.springframework.cloud.gateway: WARN
