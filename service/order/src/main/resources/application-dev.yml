spring:
  datasource:
    url: jdbc:h2:tcp://localhost:8082/~/test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

external:
  deposits:
    base-url: http://localhost:9003
  products:
    base-url: http://localhost:9004

logging:
  level:
    jabaclass: DEBUG
    org.springframework.web: DEBUG
