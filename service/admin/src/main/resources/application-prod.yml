datasource:
  jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jabadb}
  driver-class-name: org.postgresql.Driver
  username: ${POSTGRES_USER:postgres}
  password: ${POSTGRES_PASSWORD:postgres}
  minimum-idle: 1
  maximum-pool-size: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
