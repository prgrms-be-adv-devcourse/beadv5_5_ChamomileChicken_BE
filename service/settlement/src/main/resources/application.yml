server:
  port: 9002

spring:
  application:
    name: settlement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: false

clients:
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:9001}
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:9005}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:9004}
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:9003}
  transfer:
    base-url: ${TRANSFER_SERVICE_BASE_URL:http://localhost:9006}

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-local-settlement-module-only}
  access-token-validity: 1800000
  refresh-token-validity: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health

settlement:
  batch:
    load:
      cron: "${SETTLEMENT_BATCH_LOAD_CRON:0 0 1 * * *}"
      target-date-offset-days: ${SETTLEMENT_BATCH_LOAD_TARGET_DATE_OFFSET_DAYS:0}
    calculate:
      cron: "${SETTLEMENT_BATCH_CALCULATE_CRON:0 0 2 1 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_CALCULATE_TARGET_MONTH_OFFSET_MONTHS:1}
    transfer:
      cron: "${SETTLEMENT_BATCH_TRANSFER_CRON:0 0 2 2 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_TRANSFER_TARGET_MONTH_OFFSET_MONTHS:1}
