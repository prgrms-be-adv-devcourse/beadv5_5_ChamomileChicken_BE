server:
  port: 9002

spring:
  application:
    name: settlement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: false

clients:
  user:
    base-url: ${USER_SERVICE_HOST:http://localhost:9003}

management:
  endpoints:
    web:
      exposure:
        include: health

settlement:
  batch:
    calculate:
      cron: "${SETTLEMENT_BATCH_CALCULATE_CRON:0 0 2 1 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_CALCULATE_TARGET_MONTH_OFFSET_MONTHS:1}
    transfer:
      cron: "${SETTLEMENT_BATCH_TRANSFER_CRON:0 0 2 2 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_TRANSFER_TARGET_MONTH_OFFSET_MONTHS:1}
