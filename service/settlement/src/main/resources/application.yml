server:
  port: 9002

spring:
  application:
    name: settlement
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:tcp://localhost:${H2_TCP_PORT:8082}/~/test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  batch:
    jdbc:
      initialize-schema: always

clients:
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:9001}
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:9005}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:9004}
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:9003}
  transfer:
    base-url: ${TRANSFER_SERVICE_BASE_URL:http://localhost:9006}

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-local-settlement-module-only}
  access-token-validity: 1800000
  refresh-token-validity: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health
