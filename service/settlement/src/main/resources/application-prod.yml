api:
  user-host: ${USER_SERVICE_URL}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:backend5}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 4
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 180000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: WARN

settlement:
  batch:
    calculate:
      cron: "${SETTLEMENT_BATCH_CALCULATE_CRON:0 */5 * * * *}"
    transfer:
      cron: "${SETTLEMENT_BATCH_TRANSFER_CRON:30 */5 * * * *}"
