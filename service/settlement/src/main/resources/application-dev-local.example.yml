spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/settlement_perf
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

settlement:
  perf:
    seed:
      enabled: false
      truncate-before-seed: false
      seller-count: 10000
      target-month-payment-count: 1000000
      previous-month-payment-count: 300000
      two-months-ago-payment-count: 200000
      refund-ratio: 0.12
      promoted-seller-ratio: 0.08
      existing-settlement-ratio: 0.25
      batch-size: 5000
      target-month: "2026-04"
      random-seed: 202604
