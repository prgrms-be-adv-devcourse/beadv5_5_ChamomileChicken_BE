spring:
  datasource:
    url: jdbc:h2:mem:settlement-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

clients:
  payment:
    base-url: http://localhost:9001
  order:
    base-url: http://localhost:9005
  product:
    base-url: http://localhost:9004
  user:
    base-url: http://localhost:9003
  transfer:
    base-url: http://localhost:9006

jwt:
  secret: "test-environment-secret-key-must-be-32-chars-long-!!!"
  access-token-validity: 1800000
  refresh-token-validity: 604800000
