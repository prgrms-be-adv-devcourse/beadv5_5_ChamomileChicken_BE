server:
  port: 9006
  servlet:
    session:
      timeout: 60m          # 비활성 60분 후 세션 만료 (accessToken 30분 + 여유분)
      cookie:
        http-only: true     # JS에서 세션 쿠키 직접 접근 차단
        same-site: strict   # 크로스 사이트 요청에 쿠키 미포함

spring:
  application:
    name: frontend
  thymeleaf:
    cache: false

services:
  user-url: ${USER_SERVICE_HOST:http://localhost:9003}
  product-url: ${PRODUCT_SERVICE_HOST:http://localhost:9004}
  order-url: ${ORDER_SERVICE_HOST:http://localhost:9005}
  payment-url: ${PAYMENT_SERVICE_HOST:http://localhost:9001}
  file-url: ${FILE_SERVICE_HOST:http://localhost:9000}

internal:
  api:
    key: ${INTERNAL_KEY:test-internal-key}

logging:
  level:
    jabaclass.frontend.config.TokenRefreshInterceptor: DEBUG

toss:
  client-key: ${TOSS_CLIENT_KEY:test_ck_yL0qZ4G1VOj211Mwom2v3oWb2MQY}
  success-url: ${FRONTEND_SERVICE_HOST:http://localhost:9006}/payment/success
  fail-url: ${FRONTEND_SERVICE_HOST:http://localhost:9006}/payment/fail
  deposit-success-url: ${FRONTEND_SERVICE_HOST:http://localhost:9006}/deposit/success
  deposit-fail-url: ${FRONTEND_SERVICE_HOST:http://localhost:9006}/deposit/fail
