<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common-head :: head('상품 등록 - Jaba')}"></head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-900 dark:text-white antialiased min-h-screen">

<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <header class="flex justify-between items-center mb-10 pb-4 border-b border-gray-200 dark:border-gray-800">
        <a href="/products" class="text-2xl font-bold tracking-tight">Jaba 클래스</a>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" title="테마 변경"
                    class="p-2 rounded-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <svg class="w-4 h-4 theme-icon-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg class="w-4 h-4 theme-icon-dark hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </div>
    </header>

    <div class="bg-white dark:bg-[#1e1e1e] border border-gray-200 dark:border-gray-800 rounded-2xl p-8">
        <h2 class="text-xl font-bold mb-8">상품 등록</h2>

        <div th:if="${errorMessage}" class="bg-red-50 dark:bg-red-900/30 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg mb-6 text-sm"
             th:text="${errorMessage}"></div>

        <form th:action="@{/seller/products/new}" method="post" class="space-y-6" id="productForm">

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">상품명 *</label>
                <input type="text" name="title" required placeholder="상품명을 입력해주세요"
                       class="w-full px-4 py-3 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">가격 (원) *</label>
                <input type="number" name="price" required min="1" placeholder="가격을 입력해주세요"
                       class="w-full px-4 py-3 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">최대 인원 *</label>
                <input type="number" name="maxCapacity" required min="1" placeholder="최대 인원을 입력해주세요"
                       class="w-full px-4 py-3 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">상품 설명</label>
                <textarea name="description" rows="4" placeholder="상품에 대한 설명을 입력해주세요"
                          class="w-full px-4 py-3 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors resize-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">상품 이미지 (최대 10장)</label>
                <div id="imageUploadArea"
                     class="w-full border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-lg p-6 text-center cursor-pointer hover:border-blue-400 dark:hover:border-blue-500 transition-colors"
                     onclick="document.getElementById('fileInput').click()">
                    <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-sm text-gray-400 dark:text-gray-500">클릭하여 이미지 파일 선택</p>
                    <p class="text-xs text-gray-400 dark:text-gray-600 mt-1">JPG, PNG, WEBP (선택 사항)</p>
                </div>
                <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)" />
                <div id="imagePreviewList" class="mt-3 grid grid-cols-3 gap-2"></div>
                <div id="uploadStatus" class="mt-2 text-xs text-gray-500 dark:text-gray-400"></div>
                <div id="imageIdInputs"></div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400">클래스 일정</label>
                    <button type="button" onclick="addSchedule()"
                            class="text-xs text-blue-500 hover:text-blue-600 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
                        + 일정 추가
                    </button>
                </div>
                <div id="scheduleList" class="space-y-3">
                    <div class="schedule-row flex gap-2 items-start">
                        <div class="flex-1">
                            <input type="date" name="scheduleDt" required
                                   class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
                        </div>
                        <div class="w-28">
                            <input type="time" name="startTime" required
                                   class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
                        </div>
                        <div class="w-28">
                            <input type="time" name="endTime" required
                                   class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#121212] border border-gray-300 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
                        </div>
                        <button type="button" onclick="removeSchedule(this)" class="mt-2.5 text-gray-400 hover:text-red-500 transition-colors text-lg leading-none">×</button>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <a href="/products"
                   class="flex-1 py-3 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 font-medium rounded-lg text-sm text-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    취소
                </a>
                <button type="button" id="submitBtn" onclick="submitForm()"
                        class="flex-1 py-3 bg-gray-900 dark:bg-white text-white dark:text-black font-bold rounded-lg text-sm hover:bg-gray-700 dark:hover:bg-gray-200 transition-colors">
                    등록하기
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function addSchedule() {
        const list = document.getElementById('scheduleList');
        const row = document.querySelector('.schedule-row').cloneNode(true);
        row.querySelectorAll('input').forEach(input => input.value = '');
        row.querySelectorAll('input[name="scheduleDt"]').forEach(i => i.removeAttribute('required'));
        list.appendChild(row);
    }
    function removeSchedule(btn) {
        const rows = document.querySelectorAll('.schedule-row');
        if (rows.length > 1) btn.closest('.schedule-row').remove();
    }

    const uploadedFileIds = [];
    let uploading = false;
    let dragSrcEl = null;

    async function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        const remaining = 10 - uploadedFileIds.length;
        const toUpload = files.slice(0, remaining);

        if (toUpload.length === 0) {
            setStatus('이미지는 최대 10장까지 첨부할 수 있습니다.', 'error');
            return;
        }

        uploading = true;
        setStatus(`이미지 업로드 중... (0/${toUpload.length})`, 'loading');
        document.getElementById('submitBtn').disabled = true;

        for (let i = 0; i < toUpload.length; i++) {
            const file = toUpload[i];
            try {
                const fileId = await uploadFile(file);
                uploadedFileIds.push(fileId);
                addPreview(file, fileId);
                syncHiddenInputs();
                setStatus(`이미지 업로드 중... (${i + 1}/${toUpload.length})`, 'loading');
            } catch (e) {
                setStatus(`"${file.name}" 업로드 실패: ${e.message}`, 'error');
            }
        }

        uploading = false;
        setStatus(uploadedFileIds.length > 0 ? `${uploadedFileIds.length}장 업로드 완료` : '', 'ok');
        document.getElementById('submitBtn').disabled = false;
        event.target.value = '';
    }

    async function uploadFile(file) {
        const res = await fetch('/api/files/upload-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ originalName: file.name })
        });
        if (!res.ok) throw new Error('업로드 URL 발급 실패');
        const data = await res.json();

        const s3Res = await fetch(data.uploadUrl, {
            method: 'PUT',
            body: file
        });
        if (!s3Res.ok) throw new Error('S3 업로드 실패');

        const completeRes = await fetch(`/api/files/${data.fileId}/complete`, { method: 'PATCH' });
        if (!completeRes.ok) throw new Error('업로드 확정 실패');

        return data.fileId;
    }

    function addPreview(file, fileId) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const list = document.getElementById('imagePreviewList');
            const div = document.createElement('div');
            div.className = 'relative group cursor-grab active:cursor-grabbing select-none';
            div.dataset.fileId = fileId;
            div.draggable = true;
            div.innerHTML = `
            <img src="${e.target.result}"
                 class="w-full h-20 object-cover rounded-lg border border-gray-200 dark:border-gray-700 pointer-events-none" />
            <button type="button" onclick="removeImage('${fileId}')"
                class="absolute top-1 right-1 bg-black bg-opacity-60 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">×</button>
            <div class="order-badge absolute bottom-1 left-1 text-white text-xs px-1.5 py-0.5 rounded font-medium bg-black bg-opacity-60"></div>
        `;

            div.addEventListener('dragstart', (e) => {
                dragSrcEl = div;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => div.classList.add('opacity-40'), 0);
            });
            div.addEventListener('dragend', () => {
                div.classList.remove('opacity-40');
                document.querySelectorAll('#imagePreviewList > div').forEach(el => {
                    el.classList.remove('border-2', 'border-blue-400');
                });
            });
            div.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                document.querySelectorAll('#imagePreviewList > div').forEach(el => {
                    el.classList.remove('border-2', 'border-blue-400');
                });
                div.classList.add('border-2', 'border-blue-400');
            });
            div.addEventListener('dragleave', () => {
                div.classList.remove('border-2', 'border-blue-400');
            });
            div.addEventListener('drop', (e) => {
                e.preventDefault();
                if (dragSrcEl && dragSrcEl !== div) {
                    const list = document.getElementById('imagePreviewList');
                    const items = [...list.children];
                    const srcIdx = items.indexOf(dragSrcEl);
                    const dstIdx = items.indexOf(div);
                    if (srcIdx < dstIdx) {
                        list.insertBefore(dragSrcEl, div.nextSibling);
                    } else {
                        list.insertBefore(dragSrcEl, div);
                    }
                    syncFileIds();
                    updateOrderBadges();
                }
            });

            list.appendChild(div);
            updateOrderBadges();
        };
        reader.readAsDataURL(file);
    }

    function removeImage(fileId) {
        const idx = uploadedFileIds.indexOf(fileId);
        if (idx > -1) uploadedFileIds.splice(idx, 1);
        document.querySelector(`[data-file-id="${fileId}"]`)?.remove();
        syncHiddenInputs();
        updateOrderBadges();
        setStatus(uploadedFileIds.length > 0 ? `${uploadedFileIds.length}장 업로드됨` : '', 'ok');
    }

    // DOM 순서 기준으로 uploadedFileIds 와 hidden inputs 동기화
    function syncFileIds() {
        const list = document.getElementById('imagePreviewList');
        uploadedFileIds.length = 0;
        [...list.children].forEach(item => uploadedFileIds.push(item.dataset.fileId));
        syncHiddenInputs();
    }

    function syncHiddenInputs() {
        const container = document.getElementById('imageIdInputs');
        container.innerHTML = '';
        uploadedFileIds.forEach(id => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'imageIds';
            input.value = id;
            container.appendChild(input);
        });
    }

    // 첫 번째 이미지는 '썸네일', 나머지는 순서 번호 표시
    function updateOrderBadges() {
        const list = document.getElementById('imagePreviewList');
        [...list.children].forEach((item, idx) => {
            const badge = item.querySelector('.order-badge');
            if (!badge) return;
            if (idx === 0) {
                badge.textContent = '썸네일';
                badge.classList.add('bg-blue-500', 'bg-opacity-90');
                badge.classList.remove('bg-black', 'bg-opacity-60');
            } else {
                badge.textContent = idx + 1;
                badge.classList.add('bg-black', 'bg-opacity-60');
                badge.classList.remove('bg-blue-500', 'bg-opacity-90');
            }
        });
    }

    function setStatus(msg, type) {
        const el = document.getElementById('uploadStatus');
        el.textContent = msg;
        el.className = 'mt-2 text-xs ' + (type === 'error' ? 'text-red-500' : type === 'loading' ? 'text-blue-500' : 'text-gray-500 dark:text-gray-400');
    }

    async function submitForm() {
        if (uploading) return;
        document.getElementById('productForm').submit();
    }
</script>
</body>
</html>
