<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common-head :: head('회원가입 - Jaba')}"></head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-900 dark:text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-sm bg-white dark:bg-[#1e1e1e] border border-gray-200 dark:border-gray-800 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-bold mb-6 text-center">회원가입</h2>
    <div id="errorMsg" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg mb-5 text-sm"></div>
    <div id="successMsg" class="hidden bg-green-50 dark:bg-green-900/30 border border-green-300 dark:border-green-800 text-green-700 dark:text-green-400 px-4 py-3 rounded-lg mb-5 text-sm"></div>
    <div class="space-y-4">
        <div>
            <label class="block text-sm mb-1">이메일</label>
            <div class="flex gap-2">
                <input type="email" id="email" class="flex-1 px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="이메일">
                <button id="sendBtn" onclick="sendCode()" class="px-3 py-2 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg text-sm">인증번호 발송</button>
            </div>
        </div>
        <div id="codeSection" class="hidden">
            <label class="block text-sm mb-1">인증번호</label>
            <div class="flex gap-2">
                <input type="text" id="code" maxlength="6" class="flex-1 px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="인증번호">
                <button onclick="verifyCode()" class="px-3 py-2 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg text-sm">인증하기</button>
            </div>
        </div>
        <div id="registerSection" class="hidden space-y-4">
            <input type="text" id="name" class="w-full px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="이름">
            <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="비밀번호">
            <input type="tel" id="phone" class="w-full px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="전화번호">
            <button onclick="register()" class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg font-bold">회원가입</button>
        </div>
    </div>
    <p class="text-center text-sm text-gray-500 mt-6">
        이미 계정이 있으신가요?
        <a href="/login" class="font-medium hover:underline">로그인</a>
    </p>
</div>
<script>
    let verifiedToken = '';
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.remove('hidden');
        document.getElementById('successMsg').classList.add('hidden');
    }
    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.classList.remove('hidden');
        document.getElementById('errorMsg').classList.add('hidden');
    }
    async function sendCode() {
        const email = document.getElementById('email').value.trim();
        if (!email) { showError('이메일을 입력해주세요.'); return; }
        const res = await fetch('/signup/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showError(data.error || '인증번호 발송 실패'); return; }
        showSuccess('인증번호가 발송되었습니다.');
        document.getElementById('codeSection').classList.remove('hidden');
    }
    async function verifyCode() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();
        const res = await fetch('/signup/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showError(data.error || '인증 실패'); return; }
        verifiedToken = data.verifiedToken;
        showSuccess('이메일 인증이 완료되었습니다.');
        document.getElementById('registerSection').classList.remove('hidden');
        document.getElementById('codeSection').classList.add('hidden');
    }
    async function register() {
        const payload = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            verifiedToken
        };
        const res = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showError(data.error || '회원가입 실패'); return; }
        window.location.href = '/login?registered=true';
    }
</script>
</body>
</html>
