<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common-head :: head('예치금 충전 - Jaba')}"></head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-900 dark:text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white dark:bg-[#1e1e1e] rounded-2xl border p-8 shadow-2xl">
    <h2 class="text-xl font-bold mb-4">예치금 충전</h2>
    <p class="mb-4" th:text="'현재 잔액: ₩' + ${#numbers.formatDecimal(currentDeposit, 0, 'COMMA', 0, 'POINT')}">현재 잔액</p>
    <div id="errorMsg" class="hidden bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>
    <div class="space-y-3">
        <input type="number" id="amountInput" min="1000" class="w-full px-3 py-2 border rounded-lg bg-white dark:bg-[#121212]" placeholder="충전 금액 입력">
        <button onclick="startPayment()" class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg font-bold">충전하기</button>
    </div>
</div>
<script src="https://js.tosspayments.com/v1"></script>
<script th:inline="javascript">
    const tossClientKey = /*[[${tossClientKey}]]*/ '';
    const successUrl = /*[[${depositSuccessUrl}]]*/ '';
    const failUrl = /*[[${depositFailUrl}]]*/ '';
    const userId = /*[[${userId}]]*/ '';
    const tossPayments = TossPayments(tossClientKey);
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    async function startPayment() {
        const amount = parseInt(document.getElementById('amountInput').value);
        if (!amount || amount < 1000) { showError('충전 금액은 최소 1,000원 이상이어야 합니다.'); return; }
        const res = await fetch('/deposit/prepare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showError(data.error || '결제 준비 실패'); return; }
        tossPayments.requestPayment('카드', {
            amount,
            orderId: data.depositPaymentsId,
            orderName: '예치금 충전',
            successUrl,
            failUrl
        });
    }
</script>
</body>
</html>
