server:
  port: 9001

spring:
  application:
    name: payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: jdbc:h2:tcp://localhost:${H2_TCP_PORT:8082}/~/test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:9005}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:9003}

toss:
  secret-key: ${TOSS_SECRET_KEY}
