api:
  user-host: ${USER_SERVICE_HOST}

spring:
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:backend5}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
        presigned-url-expiration: 5
      region:
        static: ap-northeast-2

logging:
  level:
    org.hibernate.SQL: WARN
