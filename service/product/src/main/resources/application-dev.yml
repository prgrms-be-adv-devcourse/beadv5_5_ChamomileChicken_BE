api:
  user-host: ${USER_SERVICE_URL:http://localhost:9003}

internal:
  file:
    url: http://localhost:9000
  api:
    key: test-internal-key

spring:
  devtools:
    restart:
      enabled: false

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  datasource:
    url: jdbc:h2:tcp://localhost:8082/~/test
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs
      version: OPENAPI_3_0

logging:
  level:
    org.hibernate.SQL: DEBUG            # 실제 실행되는 SQL
    org.hibernate.type.descriptor.sql: TRACE  # 바인딩 파라미터까지
