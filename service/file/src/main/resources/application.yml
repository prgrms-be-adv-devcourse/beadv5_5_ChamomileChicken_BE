server:
  port: 9000

spring:
  application:
    name: file

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
        #        배포시 수정
        #        presigned-url-expiration: 5
        presigned-url-expiration: 10
      region:
        static: ap-northeast-2
      # credentials는 application-local.yml 또는 환경변수로 관리

jwt:
  secret: 3f2c9a1b7d4e8f6a9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
  access-token-validity: 1800000
  refresh-token-validity: 604800000

internal:
  api:
    key: ${INTERNAL-KEY:test-internal-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
