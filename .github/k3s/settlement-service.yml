apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  labels:
    app: settlement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-service
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      containers:
        - name: settlement-service
          image: ${DOCKERHUB_USERNAME}/chamomile-settlement:${IMAGE_TAG}
          imagePullPolicy: Always

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx384m"

          envFrom:
            - configMapRef:
                name: common-config
                optional: true
            - configMapRef:
                name: settlement-config
                optional: true
            - secretRef:
                name: common-secret
                optional: true
            - secretRef:
                name: db-secret
                optional: false
            - secretRef:
                name: settlement-secret
                optional: true

          ports:
            - containerPort: 9002

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "300m"
              memory: "640Mi"

          startupProbe:
            httpGet:
              port: 9002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9002
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  labels:
    app: settlement-service
spec:
  selector:
    app: settlement-service
  ports:
    - port: 9002
      targetPort: 9002
      protocol: TCP
  type: ClusterIP
