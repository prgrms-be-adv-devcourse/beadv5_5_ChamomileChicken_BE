apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: ${DOCKERHUB_USERNAME}/chamomile-admin:${IMAGE_TAG}
          imagePullPolicy: Always

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx384m"

          envFrom:
            - configMapRef:
                name: common-config
                optional: true
            - configMapRef:
                name: admin-config
                optional: true
            - secretRef:
                name: common-secret
                optional: true
            - secretRef:
                name: db-secret
                optional: false
            - secretRef:
                name: admin-secret
                optional: true

          ports:
            - containerPort: 9008

          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "300m"
              memory: "640Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9008
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9008
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  labels:
    app: admin-service
spec:
  selector:
    app: admin-service
  ports:
    - port: 9008
      targetPort: 9008
      protocol: TCP
  type: ClusterIP
