apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  labels:
    app: admin-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z kafka-service 9092; do echo waiting for kafka-service:9092; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z redis 6379; do echo waiting for redis:6379; sleep 2; done
      containers:
        - name: admin-service
          image: ${DOCKERHUB_USERNAME}/chamomile-admin:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m"

          envFrom:
            - configMapRef:
                name: common-config
                optional: true
            - configMapRef:
                name: admin-config
                optional: true
            - secretRef:
                name: common-secret
                optional: true
            - secretRef:
                name: db-secret
                optional: false
            - secretRef:
                name: admin-secret
                optional: true

          ports:
            - containerPort: 9007

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9007
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9007
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9007
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  labels:
    app: admin-service
spec:
  selector:
    app: admin-service
  ports:
    - port: 9007
      targetPort: 9007
      protocol: TCP
  type: ClusterIP
