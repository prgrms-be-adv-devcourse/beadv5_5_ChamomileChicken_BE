apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z postgres-headless 5432; do echo waiting for postgres-headless:5432; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z redis 6379; do echo waiting for redis:6379; sleep 2; done
      containers:
        - name: api-gateway-service
          image: ${DOCKERHUB_USERNAME}/chamomile-api-gateway:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m"

          envFrom:
            - configMapRef:
                name: common-config
                optional: true
            - configMapRef:
                name: api-gateway-config
                optional: true
            - secretRef:
                name: common-secret
                optional: true
            - secretRef:
                name: db-secret
                optional: false
            - secretRef:
                name: api-gateway-secret
                optional: true

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway-service
spec:
  selector:
    app: api-gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30100
      protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8080
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8080
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8080
