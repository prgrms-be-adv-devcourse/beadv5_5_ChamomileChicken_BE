name: CD Admin Service

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'service/admin/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/cd-admin.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build admin bootJar
        run: ./gradlew :service:admin:clean :service:admin:bootJar --no-daemon

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:${{ steps.meta.outputs.image_tag }} \
            ./service/admin

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p /home/ubuntu/apps/repo
          mkdir -p /home/ubuntu/apps/deploy/env
          mkdir -p /home/ubuntu/apps/deploy/scripts
          mkdir -p /home/ubuntu/apps/data

      - name: Sync repository to fixed path
        run: |
          rsync -av --delete ./ /home/ubuntu/apps/repo/

      - name: Copy deploy script to EC2 deploy directory
        run: |
          cp /home/ubuntu/apps/repo/deploy/scripts/deploy-app.sh /home/ubuntu/apps/deploy/scripts/deploy-app.sh
          chmod +x /home/ubuntu/apps/deploy/scripts/deploy-app.sh

      - name: Create common.env
        run: |
          cat > /home/ubuntu/apps/deploy/env/common.env <<EOF
          ${{ secrets.COMMON_ENV }}
          EOF

      - name: Create admin.env
        run: |
          cat > /home/ubuntu/apps/deploy/env/admin.env <<EOF
          ${{ secrets.ADMIN_ENV }}
          EOF

      - name: Docker Hub login on EC2
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Deploy admin service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          /home/ubuntu/apps/deploy/scripts/deploy-app.sh admin

      - name: Load common env
        run: |
          set -a
          source /home/ubuntu/apps/deploy/env/common.env
          set +a
          echo "APP_HOST=$APP_HOST" >> $GITHUB_ENV

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f "http://${APP_HOST}:9008/actuator/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1