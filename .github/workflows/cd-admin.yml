name: CD Admin Service

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'service/admin/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/cd-admin.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build admin bootJar
        run: ./gradlew :service:admin:clean :service:admin:bootJar --no-daemon

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:${{ steps.meta.outputs.image_tag }} \
            ./service/admin

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-admin:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: [ self-hosted, ec2, docker ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p /home/ubuntu/apps/repo
          mkdir -p /home/ubuntu/apps/deploy/env
          mkdir -p /home/ubuntu/apps/deploy/scripts
          mkdir -p /home/ubuntu/apps/data/k3s-service

      - name: Sync repository to fixed path
        run: |
          rsync -av --delete ./ /home/ubuntu/apps/repo/

      - name: Copy deploy script
        run: |
          cp /home/ubuntu/apps/repo/.github/scripts/deploy_app.sh /home/ubuntu/apps/deploy/scripts/deploy_app.sh
          chmod +x /home/ubuntu/apps/deploy/scripts/deploy_app.sh

      - name: Copy Kubernetes YAML
        run: |
          cp /home/ubuntu/apps/repo/service/admin/admin-service.yml \
             /home/ubuntu/apps/data/k3s-service/admin-service.yml

      - name: Create common_config.env
        run: |
          printf '%s\n' '${{ secrets.COMMON_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/common_config.env

      - name: Create common_secret.env
        run: |
          printf '%s\n' '${{ secrets.COMMON_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/common_secret.env

      - name: Create admin_config.env
        run: |
          printf '%s\n' '${{ secrets.ADMIN_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/admin_config.env

      - name: Create admin_secret.env
        run: |
          printf '%s\n' '${{ secrets.ADMIN_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/admin_secret.env

      - name: Deploy admin service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          /home/ubuntu/apps/deploy/scripts/deploy_app.sh admin

      - name: Health check
        run: |
          kubectl rollout status deployment/admin-service --timeout=120s

          kubectl port-forward svc/admin-service 9008:9008 >/tmp/admin.log 2>&1 &
          PF_PID=$!
          sleep 5

          STATUS_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:9008/actuator/health/readiness || echo "000")

          kill $PF_PID || true

          if [[ "$STATUS_CODE" != "200" ]]; then
            echo "Health check failed"
            exit 1
          fi
