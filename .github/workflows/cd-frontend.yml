name: CD Frontend Service

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'service/frontend/**'
      - 'service/build.gradle'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/cd-frontend.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build frontend bootJar
        run: ./gradlew :service:frontend:clean :service:frontend:bootJar --no-daemon

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-frontend:${{ steps.meta.outputs.image_tag }} \
            ./service/frontend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-frontend:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p /home/ubuntu/apps/repo
          mkdir -p /home/ubuntu/apps/deploy/env
          mkdir -p /home/ubuntu/apps/deploy/scripts
          mkdir -p /home/ubuntu/apps/data

      - name: Sync repository to fixed path
        run: |
          rsync -av --delete ./ /home/ubuntu/apps/repo/

      - name: Copy deploy script to EC2 deploy directory
        run: |
          cp /home/ubuntu/apps/repo/.github/scripts/deploy-app.sh /home/ubuntu/apps/deploy/scripts/deploy-app.sh
          chmod +x /home/ubuntu/apps/deploy/scripts/deploy-app.sh

      - name: Create common.env
        run: |
          printf '%s' '${{ secrets.COMMON_ENV }}' > /home/ubuntu/apps/deploy/env/common.env

      - name: Create frontend.env
        run: |
          printf '%s' '${{ secrets.FRONTEND_ENV }}' > /home/ubuntu/apps/deploy/env/frontend.env

      - name: Docker Hub login on EC2
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Deploy frontend service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          /home/ubuntu/apps/deploy/scripts/deploy-app.sh frontend

      - name: Load common env
        run: |
          set -a
          source /home/ubuntu/apps/deploy/env/common.env
          set +a
          echo "APP_HOST=$APP_HOST" >> $GITHUB_ENV

      - name: Debug deploy state
        run: |
          echo "APP_HOST=[$APP_HOST]"
          echo "===== docker ps -a ====="
          docker ps -a
          echo "===== docker compose ps ====="
          cd /home/ubuntu/apps/data/service && docker compose ps || true
          echo "===== frontend-service logs ====="
          docker logs frontend-service --tail 200 || true

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error --max-time 5 "http://localhost:9006/login"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Retrying..."
            sleep 5
          done
          echo "Health check failed"
          docker logs frontend-service --tail 200 || true
          exit 1
