name: CD K3S Backend Test Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "테스트 배포할 서비스 선택"
        required: true
        type: choice
        options:
          - user
          - product
          - settlement
          - payment
          - order

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [ self-hosted, ec2, docker ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p /home/ubuntu/apps/repo
          mkdir -p /home/ubuntu/apps/deploy/env
          mkdir -p /home/ubuntu/apps/deploy/scripts
          mkdir -p /home/ubuntu/apps/data/k3s-test

      - name: Sync repository to fixed path
        run: |
          rsync -av --delete ./ /home/ubuntu/apps/repo/

      - name: Copy test deploy script
        run: |
          cp /home/ubuntu/apps/repo/.github/scripts/deploy_test_app.sh \
             /home/ubuntu/apps/deploy/scripts/deploy_test_app.sh
          chmod +x /home/ubuntu/apps/deploy/scripts/deploy_test_app.sh

      - name: Copy test YAML files
        run: |
          cp /home/ubuntu/apps/repo/k3s-test/* /home/ubuntu/apps/data/k3s-test/

      - name: Create common env files
        run: |
          printf '%s\n' '${{ secrets.COMMON_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/common_config.env
          printf '%s\n' '${{ secrets.COMMON_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/common_secret.env

      - name: Create selected service env files
        run: |
          SERVICE="${{ github.event.inputs.service }}"

          case "$SERVICE" in
            user)
              printf '%s\n' '${{ secrets.USER_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/user_config.env
              printf '%s\n' '${{ secrets.USER_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/user_secret.env
              ;;
            product)
              printf '%s\n' '${{ secrets.PRODUCT_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/product_config.env
              printf '%s\n' '${{ secrets.PRODUCT_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/product_secret.env
              ;;
            settlement)
              printf '%s\n' '${{ secrets.SETTLEMENT_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/settlement_config.env
              printf '%s\n' '${{ secrets.SETTLEMENT_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/settlement_secret.env
              ;;
            payment)
              printf '%s\n' '${{ secrets.PAYMENT_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/payment_config.env
              printf '%s\n' '${{ secrets.PAYMENT_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/payment_secret.env
              ;;
            order)
              printf '%s\n' '${{ secrets.ORDER_CONFIG_ENV }}' > /home/ubuntu/apps/deploy/env/order_config.env
              printf '%s\n' '${{ secrets.ORDER_SECRET_ENV }}' > /home/ubuntu/apps/deploy/env/order_secret.env
              ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac

      - name: Verify files
        run: |
          ls -l /home/ubuntu/apps/deploy/env
          ls -l /home/ubuntu/apps/deploy/scripts
          ls -l /home/ubuntu/apps/data/k3s-test

      - name: Deploy selected test service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: latest
        run: |
          /home/ubuntu/apps/deploy/scripts/deploy_test_app.sh "${{ github.event.inputs.service }}"

      - name: Health check
        run: |
          SERVICE="${{ github.event.inputs.service }}"

          case "$SERVICE" in
            user) PORT=9003; URL="http://localhost:9003/actuator/health/readiness" ;;
            product) PORT=9004; URL="http://localhost:9004/actuator/health/readiness" ;;
            settlement) PORT=9002; URL="http://localhost:9002/actuator/health/readiness" ;;
            payment) PORT=9001; URL="http://localhost:9001/actuator/health/readiness" ;;
            order) PORT=9005; URL="http://localhost:9005/actuator/health/readiness" ;;
            *) echo "Unsupported service: $SERVICE"; exit 1 ;;
          esac

          kubectl rollout status deployment/${SERVICE}-service --timeout=120s

          kubectl port-forward svc/${SERVICE}-service ${PORT}:${PORT} >/tmp/${SERVICE}-portforward.log 2>&1 &
          PF_PID=$!
          sleep 5

          STATUS_CODE=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 "$URL" || echo "000")

          kill $PF_PID || true

          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "304" ]]; then
            echo "Health check failed: service=$SERVICE status=$STATUS_CODE"
            POD_NAME=$(kubectl get pods -l app=${SERVICE}-service -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD_NAME" ]; then
              kubectl logs "$POD_NAME" --tail=200 || true
            fi
            exit 1
          fi

          echo "Health check passed: service=$SERVICE status=$STATUS_CODE"