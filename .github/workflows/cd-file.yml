name: CD File Service

on:
  # 수동 실행 가능
  workflow_dispatch:

  # dev 브랜치에 push 되었을 때 실행
  push:
    branches:
      - dev
    paths:
      # file 서비스 코드가 바뀌었을 때
      - 'service/file/**'

      # common 모듈이 바뀌었을 때
      - 'common/**'

      # 루트 빌드 설정이 바뀌었을 때
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'

      # 이 workflow 파일 자체가 바뀌었을 때
      - '.github/workflows/cd-file.yml'

permissions:
  # checkout에 필요한 최소 권한
  contents: read

jobs:
  build-and-push:
    # GitHub가 제공하는 호스티드 러너에서 실행
    runs-on: ubuntu-latest

    outputs:
      # 다음 deploy job에서 사용할 이미지 태그를 전달
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build file bootJar
        run: ./gradlew :service:file:clean :service:file:bootJar --no-daemon

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-file:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-file:${{ steps.meta.outputs.image_tag }} \
            ./service/file

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-file:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chamomile-file:${{ steps.meta.outputs.image_tag }}

  deploy:
    # build-and-push job이 성공해야만 deploy 실행
    needs: build-and-push

    # EC2 안에 설치된 self-hosted runner에서 실행
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p /home/ubuntu/apps/repo
          mkdir -p /home/ubuntu/apps/deploy/env
          mkdir -p /home/ubuntu/apps/deploy/scripts
          mkdir -p /home/ubuntu/apps/data

      - name: Sync repository to fixed path
        run: |
          rsync -av --delete ./ /home/ubuntu/apps/repo/

      - name: Copy deploy script to EC2 deploy directory
        run: |
          cp /home/ubuntu/apps/repo/deploy/scripts/deploy-app.sh /home/ubuntu/apps/deploy/scripts/deploy-app.sh
          chmod +x /home/ubuntu/apps/deploy/scripts/deploy-app.sh

      - name: Create common.env
        run: |
          cat > /home/ubuntu/apps/deploy/env/common.env <<EOF
          ${{ secrets.COMMON_ENV }}
          EOF

      - name: Create file.env
        run: |
          cat > /home/ubuntu/apps/deploy/env/file.env <<EOF
          ${{ secrets.FILE_ENV }}
          EOF

      - name: Docker Hub login on EC2
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Deploy file service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          /home/ubuntu/apps/deploy/scripts/deploy-app.sh file

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:9000/actuator/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Retrying..."
            sleep 5
          done

          echo "Health check failed"
          exit 1