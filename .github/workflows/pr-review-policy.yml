name: PR Review Policy

on:
  pull_request:
    branches: ["dev"]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
      - review_request_removed

  pull_request_review:
    branches: ["dev"]
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  review-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR review policy
        uses: actions/github-script@v8
        with:
          script: |
            if (
              context.eventName !== "pull_request" &&
              context.eventName !== "pull_request_review"
            ) {
              core.info(`Unsupported event: ${context.eventName}. Skipping.`);
              return;
            }

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;
            const prAuthor = pr.user?.login;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100
              }
            );

            const changedFiles = files.map(file => file.filename);

            core.info(`Changed files: ${changedFiles.join(", ")}`);

            const isDocsOnly =
              changedFiles.length > 0 &&
              changedFiles.every(path =>
                path.startsWith("docs/") || path.endsWith(".md")
              );

            if (isDocsOnly) {
              core.info("Docs-only PR detected. Approval not required.");
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number,
                per_page: 100
              }
            );

            const approvers = [...new Set(
              reviews
                .filter(review => review.state === "APPROVED")
                .map(review => review.user?.login)
                .filter(Boolean)
                .filter(login => login !== prAuthor)
            )];

            core.info(`Approvers: ${approvers.join(", ") || "none"}`);

            if (approvers.length < 1) {
              core.setFailed(
                `Code change PR requires at least 1 approval. Current approvals: ${approvers.length}`
              );
              return;
            }

            core.info("Approval requirement satisfied.");